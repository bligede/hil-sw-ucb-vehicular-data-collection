; platformio.ini — node sensor
; Dasar: Panduan HIL Subbab 1.2. Pustaka ADXL345 SparkFun tidak dipakai karena
; modules/sensor.cpp mengakses register ADXL345 langsung lewat Wire, sehingga
; penamaan fungsi pustaka tidak lagi menjadi sumber ketidakcocokan.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; LoRa TIDAK diambil lewat lib_deps: dipakai salinan lokal di lib/LoRa, satu
; patch minimal (isTransmitting() dipindah private->public, isinya tidak
; berubah) supaya modules/radio.cpp dapat memakainya untuk mencuplik energi
; selama transmisi (D1). Lihat catatan berkas di lib/LoRa/src/LoRa.h.
;
; INA219_WE dikunci PERSIS ke 1.4.1, bukan pakai caret ^: versi 1.3.4 yang
; tertulis pada draf sebelumnya sudah tidak tersedia lagi di registry
; PlatformIO (per 15 September 2026, hanya 1.4.1 yang terdaftar). Versi 1.4.x
; menambah awalan INA219_ pada seluruh nama enum (mis. PG_320 -> INA219_PG_320,
; BIT_MODE_12 -> INA219_BIT_MODE_12, CONTINUOUS -> INA219_CONTINUOUS; nama
; metode setPGain/setBusRange/setADCMode/setMeasureMode tidak berubah),
; sehingga modules/energy_meter.cpp ditulis ulang mengikuti API 1.4.1. Mengunci
; versi persis konsisten dengan SOP
; gerbang G5 (konfigurasi dibekukan) dan menghindari pustaka berubah diam-diam
; di balik kode yang sudah divalidasi.
lib_deps =
    wollewald/INA219_WE @ 1.4.1

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; Untuk menjalankan nilai asli Panduan HIL selama menunggu persetujuan
; penyimpangan, tambahkan pada build_flags di atas:
;   -DPAKAI_NILAI_PANDUAN
;
; Mencakup D2, D3, D4, D5, dan D7. WAJIB disetel bersamaan dengan project
; gateway, karena durasi pemindaian di sini dan selang beacon di sana adalah
; sepasang. Cakupan lengkap beserta alasan D1, D6, dan D9 tidak ikut ada di
; src/config/params.h.

; Program uji Tahap 4.1 (INA219 lawan multimeter). Bukan firmware node;
; dipasang sementara lalu firmware node dipasang kembali dengan env esp32dev.
[env:kalibrasi_ina219]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/kalibrasi_ina219.cpp>

; Program uji: apakah pencuplikan INA219 selama transmisi LoRa berjalan.
; Bukan firmware node.
[env:uji_tx_arus]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_tx_arus.cpp>

; Program uji: arus INA219 selama transmisi, dilaporkan lewat radio ke gateway
; (dipakai saat node berjalan dari baterai tanpa USB). Bukan firmware node.
[env:uji_tx_radio]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_tx_radio.cpp> +<modules/payload.cpp>

; Program uji SOP Tahap 4.2: persistensi RTC RAM lintas deep sleep 5 detik,
; dijalankan dari baterai; hasil dikirim lewat radio ke gateway. Bukan firmware node.
[env:uji_rtc_ram]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_rtc_ram.cpp> +<modules/payload.cpp>

; Uji meja SOP Tahap 4.4: ambang BATTERY_GUARD dinaikkan di atas tegangan baterai
; penuh. Bukan firmware penelitian.
[env:uji_guard]
extends     = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUJI_GUARD

; Uji tidur panjang J5019: sama dengan uji_rtc_ram, tidur 60 detik (cooldown) dan
; 3600 detik (guard). Bukan firmware penelitian.
[env:uji_rtc_60s]
extends          = env:uji_rtc_ram
build_flags      =
    ${env:esp32dev.build_flags}
    -DUJI_TIDUR_S=60

; Uji unit agen dengan riwayat pendek yang dihitung tangan (catatan Pembimbing I,
; 1 Nov 2026, A.1). Cukup papan ESP32 dan USB. Bukan firmware penelitian.
[env:uji_agen]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_agen.cpp> +<modules/SW_UCB_Agent.cpp>

[env:uji_agen_ucb1]
extends          = env:uji_agen
build_flags      =
    ${env:esp32dev.build_flags}
    -DMODE_UCB1

[env:uji_rtc_3600s]
extends          = env:uji_rtc_ram
build_flags      =
    ${env:esp32dev.build_flags}
    -DUJI_TIDUR_S=3600

; Diagnosis radio node (14 Nov 2026): register versi SX1278, dengar beacon gateway,
; kirim paket uji tiap 3 detik. Bukan firmware penelitian.
[env:diag_radio]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/diag_radio.cpp> +<modules/payload.cpp>

; Program uji: VIN ESP32 saat transmisi Arm 4 lawan idle, dibaca dengan Fluke (arahan
; Pembimbing I 15 Nov 2026 butir 1 / D19). Fase IDLE 20 s dan TX beruntun 20 s bergantian.
; Bukan firmware node.
[env:uji_vin_tx]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_vin_tx.cpp>

; Program uji: SNR per arm per menit, urutan arm 3, 1, 4, 2, blok 60 s, paket tiap 3 s,
; 5 putaran (arahan Pembimbing I 15 Nov 2026 butir 3 / C.3). Bukan firmware node.
[env:uji_sapuan_arm]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_sapuan_arm.cpp> +<modules/payload.cpp>

; Sweep jarak dekat C.3 (arahan Pembimbing I 19 Nov 2026 nomor 2 dan 3): mode sweep firmware node, arm
; bergiliran per siklus ACK seperti SWEEP_EMAKS_01, ditambah cetak balik RegPaConfig/RegPaDac/RegOcp tiap arm
; berganti (-DCETAK_REG_PA). Bukan firmware resmi; sesudah uji, node-1.2 dipasang lagi + verify_flash.
[env:sweep_1234]
extends     = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DMODE_SWEEP -DCETAK_REG_PA

[env:sweep_3142]
extends     = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DMODE_SWEEP -DSWEEP_URUTAN_3142 -DCETAK_REG_PA

; Program uji: TX beruntun per arm (40 s TX + 20 s IDLE, berulang) dengan cetak balik register daya, arus
; INA219 rata-rata per fase (arahan Pembimbing I 19 Nov 2026 nomor 3 dan 4). Bukan firmware node.
[env:uji_tx_arm]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_tx_arm.cpp>

; Uji BATTERY_GUARD dengan sel lapangan (catatan 2 Nov 2026 C.4): firmware node resmi dengan ambang asli
; 3,30 V / 3,50 V, tidur guard 60 s (bukan 3600 s). Bukan firmware resmi; sesudah uji, firmware resmi dipasang lagi.
[env:uji_guard_nyata]
extends     = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DUJI_GUARD_NYATA

; Uji penutupan siklus berbasis posisi paket (catatan Pembimbing I 1 Nov 2026 B.3): firmware node resmi,
; tetapi node sengaja TIDAK memancarkan paket pada indeks tertentu (tetap menunggu selama waktu udaranya dan
; tetap menghitungnya terkirim). Pola berganti tiap siklus ACK: {}, {5}, {4,5}, {8,9}, {7,8,9}, {0}, berulang.
; Pasangannya gateway-1.5. Periksa hasil dengan tools/cek_uji_hilang.py. Bukan firmware penelitian; sesudah
; uji, firmware resmi (env esp32dev) dipasang lagi.
[env:uji_hilang]
extends     = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DUJI_HILANG
