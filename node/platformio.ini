; platformio.ini — node sensor
; Dasar: Panduan HIL Subbab 1.2. Pustaka ADXL345 SparkFun tidak dipakai karena
; modules/sensor.cpp mengakses register ADXL345 langsung lewat Wire, sehingga
; penamaan fungsi pustaka tidak lagi menjadi sumber ketidakcocokan.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; LoRa TIDAK diambil lewat lib_deps: dipakai salinan lokal di lib/LoRa, satu
; patch minimal (isTransmitting() dipindah private->public, isinya tidak
; berubah) supaya modules/radio.cpp dapat memakainya untuk mencuplik energi
; selama transmisi (D1). Lihat catatan berkas di lib/LoRa/src/LoRa.h.
;
; INA219_WE dikunci PERSIS ke 1.4.1, bukan pakai caret ^: versi 1.3.4 yang
; tertulis pada draf sebelumnya sudah tidak tersedia lagi di registry
; PlatformIO (per 15 September 2026, hanya 1.4.1 yang terdaftar). Versi 1.4.x
; menambah awalan INA219_ pada seluruh nama enum (mis. PG_320 -> INA219_PG_320,
; BIT_MODE_12 -> INA219_BIT_MODE_12, CONTINUOUS -> INA219_CONTINUOUS; nama
; metode setPGain/setBusRange/setADCMode/setMeasureMode tidak berubah),
; sehingga modules/energy_meter.cpp ditulis ulang mengikuti API 1.4.1. Mengunci
; versi persis konsisten dengan SOP
; gerbang G5 (konfigurasi dibekukan) dan menghindari pustaka berubah diam-diam
; di balik kode yang sudah divalidasi.
lib_deps =
    wollewald/INA219_WE @ 1.4.1

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; Untuk menjalankan nilai asli Panduan HIL selama menunggu persetujuan
; penyimpangan, tambahkan pada build_flags di atas:
;   -DPAKAI_NILAI_PANDUAN
;
; Mencakup D2, D3, D4, D5, dan D7. WAJIB disetel bersamaan dengan project
; gateway, karena durasi pemindaian di sini dan selang beacon di sana adalah
; sepasang. Cakupan lengkap beserta alasan D1, D6, dan D9 tidak ikut ada di
; src/config/params.h.

; Program uji Tahap 4.1 (INA219 lawan multimeter). Bukan firmware node;
; dipasang sementara lalu firmware node dipasang kembali dengan env esp32dev.
[env:kalibrasi_ina219]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/kalibrasi_ina219.cpp>

; Program uji: apakah pencuplikan INA219 selama transmisi LoRa berjalan.
; Bukan firmware node.
[env:uji_tx_arus]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_tx_arus.cpp>

; Program uji: arus INA219 selama transmisi, dilaporkan lewat radio ke gateway
; (dipakai saat node berjalan dari baterai tanpa USB). Bukan firmware node.
[env:uji_tx_radio]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_tx_radio.cpp> +<modules/payload.cpp>

; Program uji SOP Tahap 4.2: persistensi RTC RAM lintas deep sleep 5 detik,
; dijalankan dari baterai; hasil dikirim lewat radio ke gateway. Bukan firmware node.
[env:uji_rtc_ram]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_rtc_ram.cpp> +<modules/payload.cpp>

; Uji meja SOP Tahap 4.4: ambang BATTERY_GUARD dinaikkan di atas tegangan baterai
; penuh. Bukan firmware penelitian.
[env:uji_guard]
extends     = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUJI_GUARD

; Uji tidur panjang J5019: sama dengan uji_rtc_ram, tidur 60 detik (cooldown) dan
; 3600 detik (guard). Bukan firmware penelitian.
[env:uji_rtc_60s]
extends          = env:uji_rtc_ram
build_flags      =
    ${env:esp32dev.build_flags}
    -DUJI_TIDUR_S=60

[env:uji_rtc_3600s]
extends          = env:uji_rtc_ram
build_flags      =
    ${env:esp32dev.build_flags}
    -DUJI_TIDUR_S=3600
