; platformio.ini — mobile gateway
; Gateway tidak memakai INA219 maupun ADXL345, sehingga pustakanya lebih sedikit
; daripada node. Dayanya dari USB laptop, tanpa baterai dan tanpa deep sleep.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; Untuk menjalankan nilai asli Panduan HIL, tambahkan -DPAKAI_NILAI_PANDUAN
; pada build_flags di atas. WAJIB disetel bersamaan dengan project node:
; selang beacon di sini dan durasi pemindaian di node adalah sepasang, dan
; menyetel satu sisi saja menghasilkan konfigurasi yang tidak mewakili
; rancangan mana pun. Lihat cakupan lengkapnya di node/src/config/params.h.
