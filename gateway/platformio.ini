; platformio.ini — mobile gateway
; Gateway tidak memakai INA219 maupun ADXL345, sehingga pustakanya lebih sedikit
; daripada node. Dayanya dari USB laptop, tanpa baterai dan tanpa deep sleep.

[platformio]
default_envs = esp32dev_sheets

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0
upload_speed  = 921600

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; Untuk menjalankan nilai asli Panduan HIL, tambahkan -DPAKAI_NILAI_PANDUAN
; pada build_flags di atas. WAJIB disetel bersamaan dengan project node:
; selang beacon di sini dan durasi pemindaian di node adalah sepasang, dan
; menyetel satu sisi saja menghasilkan konfigurasi yang tidak mewakili
; rancangan mana pun. Lihat cakupan lengkapnya di node/src/config/params.h.

; Build dengan unggah ke Google Sheets lewat hotspot ponsel (tanpa laptop).
; Butuh src/config/secrets.h (salin dari secrets.example.h, tidak di-commit).
; Pasang dengan: pio run -e esp32dev_sheets -t upload
[env:esp32dev_sheets]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUNGGAH_SHEETS

; Program uji gateway: catu 5 V, rail 3,3 V saat TX, dan keandalan SPI, hasil di LCD
; (arahan Pembimbing I 15 Nov 2026 butir 6). Bukan firmware gateway; sesudahnya pasang lagi
; firmware 1.4 dari data/build/gateway-1.4_firmware.bin dan periksa dengan verify_flash.
[env:uji_catu_spi]
extends          = env:esp32dev
build_src_filter = -<*> +<../uji/uji_catu_spi.cpp> +<modules/tampilan_lcd.cpp>
